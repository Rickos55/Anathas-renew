<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription — Anathas</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="auth-page">
    <div class="auth-logo">ANATHAS</div>
    <div class="auth-tagline">Rejoignez des centaines de joueurs et fondez votre nation</div>
    <div class="auth-card">
        <h2>🌍 Fonder un pays</h2>
        {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
        <form method="POST" action="{{ url_for('register') }}">
            <div class="form-group">
                <label>Nom d'utilisateur</label>
                <input type="text" name="username" required autofocus placeholder="Votre pseudonyme de chef d'état">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" required placeholder="votre@email.com">
            </div>
            <div class="form-group">
                <label>Mot de passe</label>
                <input type="password" name="password" required placeholder="Minimum 6 caractères">
            </div>
            <div class="form-group">
                <label>Nom de votre pays</label>
                <input type="text" name="country_name" required placeholder="Ex : République d'Arkenfall">
            </div>
            <button type="submit" class="btn btn-primary btn-full" style="margin-top:8px">Fonder mon pays</button>
        </form>
        <div class="auth-switch">
            Déjà un compte ? <a href="{{ url_for('login') }}">Se connecter</a>
            &nbsp;·&nbsp; <a href="{{ url_for('guide') }}">Guide du débutant</a>
        </div>
    </div>
</div>
<footer class="site-footer">Anathas — Jeu par navigateur gratuit</footer>
</body>
</html>
